const days = Object.keys(DATA).sort();
const t = new Date();
const today = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
let i = days.indexOf(today);
if (i < 0) i = days.findIndex(d => d >= today);
if (i < 0) i = days.length - 1;

function label(k){
  const [y,m,d] = k.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
}

function render(){
  const k = days[i];
  document.getElementById('date').innerHTML =
    label(k) + '<small>' + (k===today ? 'today' : k) + '</small>';
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===days.length-1;
  const out = document.getElementById('out');
  out.innerHTML = '';
  (DATA[k]||[]).forEach(c => {
    const tier = c.slot.startsWith('PERF') ? 'PERF' : c.slot;
    const body = c.frag + '\n\ud83c\udccf jestamang \ud83c\udccf\n\n' + c.tags;
    const el = document.createElement('div');
    el.className = 'c';
    el.dataset.t = tier;
    el.innerHTML =
      '<div class="meta"><span class="slot">'+c.slot+'</span><span class="reel">'+c.reel+'</span></div>'+
      '<pre>'+c.frag+'\n\ud83c\udccf jestamang \ud83c\udccf\n\n<span class="tags">'+c.tags+'</span></pre>'+
      '<button class="copy">copy</button>';
    const btn = el.querySelector('.copy');
    const fire = async () => {
      try { await navigator.clipboard.writeText(body); }
      catch(e){
        const ta=document.createElement('textarea');
        ta.value=body; ta.style.position='fixed'; ta.style.opacity=0;
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      btn.textContent='copied'; btn.classList.add('ok');
      setTimeout(()=>{btn.textContent='copy'; btn.classList.remove('ok');},1200);
    };
    btn.onclick = fire;
    el.querySelector('pre').onclick = fire;
    out.appendChild(el);
  });
  if(!DATA[k]) out.innerHTML='<div class="empty">no captions written for this day yet</div>';
  window.scrollTo(0,0);
}
document.getElementById('prev').onclick=()=>{if(i>0){i--;render();}};
document.getElementById('next').onclick=()=>{if(i<days.length-1){i++;render();}};
let x0=null;
document.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)<70)return;
  if(dx<0 && i<days.length-1){i++;render();}
  if(dx>0 && i>0){i--;render();}
},{passive:true});
render();
</script>
